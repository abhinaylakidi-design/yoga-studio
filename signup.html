<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Zenora</title>
    <link rel="icon" type="image/png" href="images/logo%201.png" />

    <script>
        try {
            var t = localStorage.getItem("zenora-theme");
            var d = localStorage.getItem("zenora-dir");
            if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
            if (d === "rtl") document.documentElement.setAttribute("dir", "rtl");
        } catch (e) { }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="auth.css" />
</head>

<body class="auth-body">

    <!-- Top-right controls -->
    <div class="auth-tools">
        <button class="icon-btn" id="rtlToggle" aria-label="Toggle right-to-left layout" title="RTL / LTR">
            <i data-lucide="arrow-left-right"></i>
        </button>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Light / Dark">
            <i data-lucide="moon" class="icon-moon"></i>
            <i data-lucide="sun" class="icon-sun"></i>
        </button>
    </div>

    <main class="auth-card">
        <a href="index.html" class="auth-brand" aria-label="Zenora home">
            <img src="images/logo%201.png" alt="" />
            <span>
                <strong>Zenora</strong>
                <small>Find Your Balance. Feel Your Peace</small>
            </span>
        </a>

        <div class="auth-head">
            <h1>Create your account</h1>
            <p>Join Zenora and begin your practice today.</p>
        </div>

        <form id="signupForm" class="auth-form" novalidate>
            <div class="field">
                <label for="name">Full name</label>
                <div class="input-wrap">
                    <i data-lucide="user-round" class="lead-icon"></i>
                    <input type="text" id="name" name="name" placeholder="Your full name" autocomplete="name" required />
                </div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <div class="input-wrap">
                    <i data-lucide="mail" class="lead-icon"></i>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i data-lucide="lock" class="lead-icon"></i>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required />
                    <button type="button" class="eye-btn" data-eye="password" aria-label="Show password">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirm">Confirm password</label>
                <div class="input-wrap">
                    <i data-lucide="lock-keyhole" class="lead-icon"></i>
                    <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" required />
                    <button type="button" class="eye-btn" data-eye="confirm" aria-label="Show password">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
            </div>

            <label class="check terms">
                <input type="checkbox" id="terms" />
                <span>I agree to the <a href="terms-and-conditions.html" class="text-link">Terms</a> &amp; <a href="privacy-policy.html" class="text-link">Privacy Policy</a></span>
            </label>

            <p class="form-msg" id="formMsg" role="alert" aria-live="polite"></p>

            <button type="submit" class="btn btn-primary auth-cta">Create Account</button>
        </form>

        <div class="divider"><span>or sign up with</span></div>

        <div class="social-row">
            <button type="button" class="social-btn" aria-label="Sign up with Google">
                <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                </svg>
                <span>Google</span>
            </button>
            <button type="button" class="social-btn" aria-label="Sign up with Apple">
                <svg viewBox="0 0 384 512" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
                </svg>
                <span>Apple</span>
            </button>
        </div>

        <p class="switch-link">Already a member? <a href="login.html">Log in</a></p>
    </main>

    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="auth.js"></script>
</body>

</html>
